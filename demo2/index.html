<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAM Realtime Webcam Demo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%233b82f6'/></svg>"
    />
    <script src="./coi-serviceworker.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="dot" id="statusDot"></span>
          <h1>SAM Realtime Webcam</h1>
          <span class="badge" id="statusBadge">Initializing…</span>
        </div>

        <div class="model-controls">
          <label class="control-group" for="resSelect">
            <span>Resolution</span>
            <select id="resSelect">
              <option value="384">384 px (Fastest)</option>
              <option value="512">512 px (Fast)</option>
              <option value="640" selected>640 px (Balanced)</option>
              <option value="768">768 px (High)</option>
              <option value="1024">1024 px (Native SAM)</option>
            </select>
          </label>
        </div>
      </header>

      <main class="stage-wrapper">
        <div class="stage" id="stage">
          <video id="webcam" autoplay playsinline muted></video>
          <canvas id="frozenCanvas" class="layer hidden"></canvas>
          <canvas id="maskCanvas" class="layer"></canvas>
          <canvas id="overlayCanvas" class="layer"></canvas>

          <div class="empty-state" id="emptyState">
            <p>Click <strong>Start Webcam</strong> to segment live video in your browser.</p>
            <p class="hint">
              Hover to preview masks • Left-click: foreground point • Right-click: background point
            </p>
          </div>
        </div>

        <section class="toolbar">
          <div class="btn-group">
            <button id="toggleCamBtn" class="btn primary">Start Webcam</button>
            <button id="modeBtn" class="btn" disabled>Mode: Live Auto-Encode</button>
            <button id="snapBtn" class="btn" disabled>Re-encode Frame</button>
            <button id="clearBtn" class="btn" disabled>Clear Points</button>
          </div>

          <div class="toggles">
            <label class="toggle">
              <input type="checkbox" id="hoverToggle" checked />
              <span>Hover Preview</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="mirrorToggle" checked />
              <span>Mirror</span>
            </label>
            <label class="slider-group">
              <span>Opacity</span>
              <input type="range" id="opacitySlider" min="0.1" max="0.9" step="0.05" value="0.5" />
            </label>
          </div>
        </section>

        <section class="metrics">
          <div class="metric">
            <span class="label">Active ONNX Model</span>
            <span class="value" id="metricModel">—</span>
          </div>
          <div class="metric">
            <span class="label">Backend</span>
            <span class="value" id="metricBackend">—</span>
          </div>
          <div class="metric">
            <span class="label">Encoder (MobileSAM FP16)</span>
            <span class="value" id="metricEncode">—</span>
          </div>
          <div class="metric">
            <span class="label">Decoder</span>
            <span class="value" id="metricDecode">—</span>
          </div>
          <div class="metric">
            <span class="label">Predicted IoU</span>
            <span class="value" id="metricIou">—</span>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
